<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gửi cậu - 20/10</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #ffe4ec 0%, #f8bbd0 50%, #f48fb1 100%);
    position: relative;
  }

  /* ===== HOA RƠI ===== */
  .falling {
    position: fixed;
    top: -60px;
    pointer-events: none;
    z-index: 2;
    animation: fall linear forwards;
    opacity: 0.85;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* ===== VÒNG TRÁI TIM BẰNG CHẤM ===== */
  #heartOutline {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 3;
    pointer-events: none;
  }
  .heart-dot {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #d81b60;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(216, 27, 96, 0.6);
    animation: dotBlink 2s ease-in-out infinite;
  }
  @keyframes dotBlink {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* ===== TEXT VÒNG CUNG ===== */
  .arc-text {
    position: absolute;
    top: 8%;
    left: 0;
    width: 100%;
    text-align: center;
    color: #d81b60;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 2px;
    z-index: 4;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(255,255,255,0.8);
    padding: 0 10px;
  }

  /* ===== PHONG BÌ ===== */
  .envelope-wrapper {
    position: relative;
    z-index: 10;
    width: 320px;
    height: 220px;
    cursor: pointer;
    transition: transform 0.5s;
  }
  .envelope-wrapper:hover { transform: scale(1.03); }

  .envelope {
    position: absolute;
    inset: 0;
  }

  .envelope-back {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #f8a5c2, #ec6f9e);
    border-radius: 8px;
    z-index: 1;
    box-shadow: 0 15px 40px rgba(216, 27, 96, 0.35);
  }

  .envelope-flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 160px solid transparent;
    border-right: 160px solid transparent;
    border-top: 110px solid #f48fb1;
    transform-origin: top;
    transition: transform 0.8s ease;
    z-index: 5;
    filter: drop-shadow(0 4px 6px rgba(216,27,96,0.2));
  }
  .envelope.open .envelope-flap {
    transform: rotateX(180deg);
    z-index: 1;
  }

  .envelope-front {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #f8a5c2, #ec6f9e);
    border-radius: 8px;
    clip-path: polygon(0 30%, 50% 65%, 100% 30%, 100% 100%, 0 100%);
    z-index: 3;
  }

  /* Thiệp chứa bên trong */
  .card-inside {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    width: 290px;
    height: 190px;
    background: #fff5f8;
    border-radius: 10px;
    padding: 18px 20px;
    box-shadow: 0 10px 30px rgba(216, 27, 96, 0.3);
    z-index: 2;
    opacity: 0;
    transition: all 0.8s ease 0.4s;
    border: 1px dashed #f48fb1;
    overflow-y: auto;
  }
  .envelope.open .card-inside {
    opacity: 1;
    transform: translateX(-50%) translateY(-150px) scale(1.05);
    z-index: 20;
  }

  .card-title {
    font-size: 18px;
    color: #d81b60;
    font-weight: 800;
    margin-bottom: 10px;
    font-style: italic;
  }
  .card-text {
    font-size: 14px;
    color: #4a4a4a;
    line-height: 1.7;
    font-style: italic;
    font-weight: 500;
    word-wrap: break-word;
  }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: #d81b60;
    margin-left: 2px;
    animation: blink 0.7s steps(1) infinite;
    vertical-align: middle;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  /* ===== GỢI Ý BẤM ===== */
  .hint {
    position: absolute;
    bottom: -55px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #ad1457;
    font-style: italic;
    animation: bounceHint 1.5s ease-in-out infinite;
    white-space: nowrap;
    transition: opacity 0.4s;
  }
  @keyframes bounceHint {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.7; }
    50% { transform: translateX(-50%) translateY(-5px); opacity: 1; }
  }

  /* ===== NÚT NEXT GÓC PHẢI DƯỚI ===== */
  .btn-next-float {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ec407a, #d81b60);
    color: #fff;
    border: none;
    font-size: 30px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(216, 27, 96, 0.5);
    transition: all 0.3s ease;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulseBtn 2s ease-in-out infinite;
    line-height: 1;
    padding-bottom: 4px;
  }
  .btn-next-float:hover {
    transform: scale(1.15) rotate(10deg);
    box-shadow: 0 12px 40px rgba(216, 27, 96, 0.7);
  }
  @keyframes pulseBtn {
    0%, 100% { box-shadow: 0 8px 25px rgba(216, 27, 96, 0.5); }
    50% { box-shadow: 0 8px 40px rgba(216, 27, 96, 0.9); }
  }

  /* ===== NÚT ĐÓNG GÓC TRÁI DƯỚI ===== */
  .btn-close-float {
    position: fixed;
    bottom: 30px;
    left: 30px;
    padding: 14px 24px;
    border-radius: 50px;
    background: rgba(255,255,255,0.9);
    color: #d81b60;
    border: 2px solid #d81b60;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(216, 27, 96, 0.25);
    transition: all 0.3s;
    z-index: 1000;
    display: none;
    font-family: inherit;
  }
  .btn-close-float:hover {
    background: #d81b60;
    color: #fff;
  }
  .btn-close-float.show { display: block; }

  @media (max-width: 600px) {
    .arc-text { font-size: 15px; letter-spacing: 1px; }
    .envelope-wrapper { width: 260px; height: 180px; }
    .envelope-flap {
      border-left-width: 130px;
      border-right-width: 130px;
      border-top-width: 90px;
    }
    .card-inside {
      width: 235px;
      height: 165px;
      padding: 14px 16px;
    }
    .envelope.open .card-inside {
      transform: translateX(-50%) translateY(-125px) scale(1.05);
    }
    .card-title { font-size: 16px; }
    .card-text { font-size: 13px; }
    .btn-next-float { width: 55px; height: 55px; font-size: 26px; bottom: 20px; right: 20px; }
    .btn-close-float { padding: 10px 18px; font-size: 12px; bottom: 20px; left: 20px; }
  }
</style>
</head>
<body>

  <!-- Vòng tim bằng chấm -->
  <div id="heartOutline"></div>

  <!-- Text chúc vòng cung -->
  <div class="arc-text">From With Love 20/10! 🌹 Happy Women's Day</div>

  <!-- Phong bì -->
  <div class="envelope-wrapper" id="envelopeWrapper" onclick="openEnvelope()">
    <div class="envelope" id="envelope">
      <div class="envelope-back"></div>
      <div class="card-inside" id="cardInside">
        <div class="card-title">Gửi cậu!</div>
        <div class="card-text" id="cardText"></div>
      </div>
      <div class="envelope-flap"></div>
      <div class="envelope-front"></div>
    </div>
    <div class="hint" id="hint">👆 Bấm vào phong bì để mở</div>
  </div>

  <!-- Nút Next góc phải dưới -->
  <button class="btn-next-float" id="btnNext" onclick="nextMessage()">›</button>

  <!-- Nút Đóng góc trái dưới -->
  <button class="btn-close-float" id="btnClose" onclick="closeEnvelope()">← Đóng lại</button>

<script>
  /* ===== TẠO VÒNG TRÁI TIM BẰNG CHẤM ===== */
  const heartOutline = document.getElementById('heartOutline');
  const dotCount = 80;

  function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    return { x: x, y: -y };
  }

  function buildHeartDots() {
    heartOutline.innerHTML = '';
    const w = window.innerWidth;
    const h = window.innerHeight;
    const scale = Math.min(w, h) / 50;

    for (let i = 0; i < dotCount; i++) {
      const t = (i / dotCount) * Math.PI * 2;
      const p = heartPoint(t);
      const dot = document.createElement('div');
      dot.className = 'heart-dot';
      dot.style.left = `calc(50% + ${p.x * scale}px - 4px)`;
      dot.style.top = `calc(50% + ${p.y * scale}px - 4px)`;
      dot.style.animationDelay = (i * 0.025) + 's';
      heartOutline.appendChild(dot);
    }
  }

  buildHeartDots();
  window.addEventListener('resize', buildHeartDots);

  /* ===== NỘI DUNG THIỆP ===== */
  const messages = [
    { title: "Gửi cậu!", text: "Chúc cậu ngày 20/10 thật vui vẻ, luôn xinh đẹp và rạng rỡ như ánh mặt trời nhé! 🌸" },
    { title: "Gửi cậu!", text: "Cảm ơn cậu vì đã luôn là chính mình — dịu dàng, mạnh mẽ và đầy yêu thương 💖" },
    { title: "Gửi cậu!", text: "Mong cậu luôn hạnh phúc, gặp nhiều điều tốt đẹp và đạt được mọi ước mơ nhé ✨" },
    { title: "Gửi cậu!", text: "Cậu là một cô gái tuyệt vời, hãy luôn tỏa sáng theo cách riêng của mình nhé 🌷" },
    { title: "Gửi cậu!", text: "Chúc mừng 20/10! Chúc cậu luôn bình an, vui vẻ và được yêu thương thật nhiều 💐" }
  ];

  let currentMsg = 0;
  const envelope = document.getElementById('envelope');
  const hint = document.getElementById('hint');
  const btnClose = document.getElementById('btnClose');
  const cardTitleEl = document.querySelector('.card-title');
  const cardTextEl = document.getElementById('cardText');

  let typeTimer = null;
  let isOpen = false;

  /* ===== MỞ PHONG BÌ ===== */
  function openEnvelope() {
    if (isOpen) return;
    isOpen = true;
    envelope.classList.add('open');
    hint.style.opacity = '0';
    btnClose.classList.add('show');

    // Đợi animation mở xong → bắt đầu gõ chữ
    setTimeout(() => {
      typeText(messages[currentMsg].text);
    }, 850);
  }

  /* ===== ĐÓNG PHONG BÌ ===== */
  function closeEnvelope() {
    isOpen = false;
    envelope.classList.remove('open');
    btnClose.classList.remove('show');
    clearInterval(typeTimer);
    cardTextEl.innerHTML = '';
    setTimeout(() => { hint.style.opacity = '1'; }, 600);
  }

  /* ===== GÕ CHỮ TỪNG KÝ TỰ ===== */
  function typeText(text) {
    clearInterval(typeTimer);
    cardTextEl.innerHTML = '<span id="typed"></span><span class="cursor"></span>';
    const typed = document.getElementById('typed');
    let i = 0;

    typeTimer = setInterval(function () {
      if (i < text.length) {
        typed.textContent += text[i];
        i++;
        if (i % 5 === 0) createFalling();
      } else {
        clearInterval(typeTimer);
      }
    }, 40); // 40ms/ký tự
  }

  /* ===== NÚT NEXT ===== */
  function nextMessage() {
    currentMsg = (currentMsg + 1) % messages.length;
    cardTitleEl.textContent = messages[currentMsg].title;

    if (isOpen) {
      typeText(messages[currentMsg].text);
    } else {
      openEnvelope();
    }

    for (let i = 0; i < 10; i++) {
      setTimeout(createFalling, i * 60);
    }
  }

  /* ===== HOA VÀ TIM RƠI ===== */
  const emojis = ['❤️', '🌸', '💖', '🌹', '💕', '🌺', '💗', '🌸', '💝', '🌷', '✨', '💐'];

  function createFalling() {
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (Math.random() * 18 + 16) + 'px';
    const duration = Math.random() * 3 + 4;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (duration + 2) * 1000);
  }

  setInterval(createFalling, 500);
</script>
</body>
</html>
