<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc Mừng 20/10</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }

  /* Hiệu ứng hoa và tim rơi */
  .falling {
    position: fixed;
    top: -60px;
    pointer-events: none;
    z-index: 1;
    animation: fall linear forwards;
    opacity: 0.8;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* Thẻ thiệp chính */
  .card {
    position: relative;
    z-index: 10;
    max-width: 520px;
    width: 100%;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(15px);
    border-radius: 30px;
    padding: 60px 35px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(233, 30, 99, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.9);
    animation: cardIn 1s ease-out;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.9) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .heart {
    font-size: 70px;
    display: inline-block;
    animation: heartbeat 1.2s ease-in-out infinite;
    margin-bottom: 20px;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    50% { transform: scale(1); }
    75% { transform: scale(1.1); }
  }

  h1 {
    font-size: 26px;
    color: #d81b60;
    margin-bottom: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
  }

  .subtitle {
    font-size: 14px;
    color: #ad1457;
    letter-spacing: 4px;
    margin-bottom: 30px;
    opacity: 0.7;
  }

  .message {
    font-size: 20px;
    color: #4a4a4a;
    line-height: 1.8;
    font-style: italic;
    font-weight: 500;
    padding: 0 10px;
  }

  @media (max-width: 480px) {
    .card { padding: 45px 22px; border-radius: 22px; }
    h1 { font-size: 20px; }
    .heart { font-size: 55px; }
    .message { font-size: 17px; }
  }
</style>
</head>
<body>

  <div class="card">
    <span class="heart">💖</span>
    <h1>Chúc Mừng 20/10</h1>
    <p class="subtitle">Ngày Phụ Nữ Việt Nam</p>
    <p class="message">
      Chúc các bạn và thầy cô luôn xinh đẹp, hạnh phúc và thành công trong cuộc sống 🌸
    </p>
  </div>

<script>
  const emojis = ['❤️', '🌸', '💖', '🌹', '💕', '🌺', '💗', '🌸', '💝', '🌷'];

  function createFalling() {
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (Math.random() * 20 + 18) + 'px';
    const duration = Math.random() * 4 + 5;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = Math.random() * 2 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (duration + 2) * 1000);
  }

  setInterval(createFalling, 400);
</script>
</body>
</html>
</html>
