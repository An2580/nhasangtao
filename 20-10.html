<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 20px;
  }

  /* ===== HIỆU ỨNG TRÁI TIM VÀ HOA RƠI ===== */
  .falling {
    position: fixed;
    top: -60px;
    pointer-events: none;
    z-index: 1;
    animation: fall linear forwards;
    opacity: 0.7;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* ===== NỘI DUNG CHÍNH ===== */
  .card {
    position: relative;
    z-index: 10;
    max-width: 520px;
    width: 100%;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(15px);
    border-radius: 30px;
    padding: 50px 35px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(233, 30, 99, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.8);
    animation: cardIn 1s ease-out;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.9) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .heart-main {
    font-size: 70px;
    display: inline-block;
    animation: heartbeat 1.2s ease-in-out infinite;
    margin-bottom: 15px;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    50% { transform: scale(1); }
    75% { transform: scale(1.1); }
  }

  h1 {
    font-size: 32px;
    color: #d81b60;
    margin-bottom: 8px;
    line-height: 1.3;
    text-shadow: 0 2px 8px rgba(216, 27, 96, 0.15);
  }

  .subtitle {
    font-size: 15px;
    color: #ad1457;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 30px;
    font-weight: 600;
  }

  .message {
    font-size: 18px;
    color: #4a4a4a;
    line-height: 1.9;
    margin-bottom: 30px;
    min-height: 120px;
    transition: opacity 0.5s ease;
    font-style: italic;
  }

  .btn {
    display: inline-block;
    padding: 16px 40px;
    background: linear-gradient(135deg, #ec407a, #d81b60);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 8px 25px rgba(216, 27, 96, 0.35);
    transition: all 0.3s ease;
  }
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(216, 27, 96, 0.5);
  }
  .btn:active { transform: translateY(0); }

  .footer-note {
    margin-top: 25px;
    font-size: 12px;
    color: #ad1457;
    opacity: 0.6;
  }

  /* ===== ĐÁP ỨNG DI ĐỘNG ===== */
  @media (max-width: 480px) {
    .card { padding: 35px 22px; border-radius: 22px; }
    h1 { font-size: 24px; }
    .heart-main { font-size: 55px; }
    .message { font-size: 16px; min-height: 100px; }
    .btn { padding: 14px 30px; font-size: 15px; }
  }
</style>
</head>
<body>

  <div class="card">
    <span class="heart-main">💖</span>
    <h1>Chúc Mừng Ngày<br>Phụ Nữ Việt Nam 20/10</h1>
    <p class="subtitle">Ngày của những người phụ nữ tuyệt vời</p>

    <p class="message" id="message">
      Nhấn nút bên dưới để nhận lời chúc đặc biệt dành cho bạn 💕
    </p>

    <button class="btn" id="btnStart">💌 Gửi lời chúc</button>

    <p class="footer-note">Gửi tặng những người phụ nữ thân yêu 🌸</p>
  </div>

<script>
  /* ===== LỜI CHÚC ===== */
  const wishes = [
    "Chúc em luôn xinh đẹp, rạng rỡ và hạnh phúc mãi mãi 🌸",
    "Chúc mẹ yêu luôn mạnh khỏe, vui vẻ và bình an 💕",
    "Chúc chị/em gái luôn thành công trong công việc và cuộc sống ✨",
    "Chúc bạn gái/người yêu luôn vui vẻ, hạnh phúc bên cạnh anh 💖",
    "Chúc tất cả phụ nữ Việt Nam một ngày 20/10 thật ý nghĩa và đáng nhớ 🌷",
    "Chúc em luôn tự tin, tỏa sáng và đạt được mọi ước mơ 🌟",
    "Cảm ơn em đã đến bên anh, chúc em 20/10 thật hạnh phúc 💝"
  ];

  let wishIndex = 0;
  const messageEl = document.getElementById('message');
  const btnStart = document.getElementById('btnStart');

  /* ===== HIỆU ỨNG RƠI ===== */
  const emojis = ['❤️', '🌸', '💖', '🌹', '💕', '🌺', '💗', '🌸', '💝', '🌷'];

  function createFalling() {
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (Math.random() * 20 + 18) + 'px';
    const duration = Math.random() * 4 + 5;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = Math.random() * 2 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (duration + 2) * 1000);
  }

  // Tạo hiệu ứng rơi liên tục
  setInterval(createFalling, 400);

  /* ===== NÚT GỬI LỜI CHÚC ===== */
  btnStart.addEventListener('click', () => {
    messageEl.style.opacity = '0';
    setTimeout(() => {
      messageEl.textContent = wishes[wishIndex];
      wishIndex = (wishIndex + 1) % wishes.length;
      messageEl.style.opacity = '1';
    }, 300);

    // Bùng nổ trái tim khi bấm
    for (let i = 0; i < 8; i++) {
      setTimeout(createFalling, i * 100);
    }

    // Đổi chữ nút sau lần bấm đầu
    if (wishIndex === 1) {
      btnStart.textContent = '💌 Lời chúc khác';
    }
  });
</script>
</body>
</html>
