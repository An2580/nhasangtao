<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc Mừng 20/10 - 12A6</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #ffe4ec 0%, #f8bbd0 50%, #f48fb1 100%);
    position: relative;
  }

  /* ===== HOA RƠI ===== */
  .falling {
    position: fixed;
    top: -60px;
    pointer-events: none;
    z-index: 2;
    animation: fall linear forwards;
    opacity: 0.85;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* ===== VÒNG TRÁI TIM BẰNG CHẤM ===== */
  #heartOutline {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 3;
    pointer-events: none;
  }
  .heart-dot {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #d81b60;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(216, 27, 96, 0.6);
    animation: dotBlink 2s ease-in-out infinite;
  }
  @keyframes dotBlink {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* ===== TEXT VÒNG CUNG ===== */
  .arc-text {
    position: absolute;
    top: 6%;
    left: 0;
    width: 100%;
    text-align: center;
    color: #d81b60;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 2px;
    z-index: 4;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(255,255,255,0.8);
    padding: 0 10px;
  }

  /* ===== PHONG BÌ ===== */
  .envelope-wrapper {
    position: relative;
    z-index: 10;
    width: 320px;
    height: 220px;
    cursor: pointer;
    transition: transform 0.5s;
  }
  .envelope-wrapper:hover { transform: scale(1.03); }

  .envelope {
    position: absolute;
    inset: 0;
  }

  .envelope-back {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #f8a5c2, #ec6f9e);
    border-radius: 8px;
    z-index: 1;
    box-shadow: 0 15px 40px rgba(216, 27, 96, 0.35);
  }

  .envelope-flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 160px solid transparent;
    border-right: 160px solid transparent;
    border-top: 110px solid #f48fb1;
    transform-origin: top;
    transition: transform 0.8s ease;
    z-index: 5;
    filter: drop-shadow(0 4px 6px rgba(216,27,96,0.2));
  }
  .envelope.open .envelope-flap {
    transform: rotateX(180deg);
    z-index: 1;
  }

  .envelope-front {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #f8a5c2, #ec6f9e);
    border-radius: 8px;
    clip-path: polygon(0 30%, 50% 65%, 100% 30%, 100% 100%, 0 100%);
    z-index: 3;
  }

  /* Thiệp chứa bên trong */
  .card-inside {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    width: 340px;
    height: 300px;
    background: #fff5f8;
    border-radius: 12px;
    padding: 20px 22px;
    box-shadow: 0 10px 40px rgba(216, 27, 96, 0.4);
    z-index: 2;
    opacity: 0;
    transition: all 0.8s ease 0.4s;
    border: 2px dashed #f48fb1;
    overflow-y: auto;
    pointer-events: none;
  }
  .envelope.open .card-inside {
    opacity: 1;
    transform: translateX(-50%) translateY(-180px) scale(1.05);
    z-index: 20;
    pointer-events: auto;
  }
  .card-inside::-webkit-scrollbar { width: 5px; }
  .card-inside::-webkit-scrollbar-thumb { background: #f48fb1; border-radius: 10px; }

  .card-title {
    font-size: 16px;
    color: #d81b60;
    font-weight: 800;
    margin-bottom: 12px;
    text-align: center;
    letter-spacing: 0.5px;
    padding-bottom: 8px;
    border-bottom: 1px dashed #f8bbd0;
  }
  .card-text {
    font-size: 13.5px;
    color: #4a4a4a;
    line-height: 1.75;
    text-align: left;
    word-wrap: break-word;
    min-height: 150px;
  }
  .card-text strong { color: #d81b60; }

  /* Con trỏ nhấp nháy */
  .cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: #d81b60;
    margin-left: 2px;
    animation: blink 0.7s steps(1) infinite;
    vertical-align: middle;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .card-page {
    text-align: center;
    font-size: 11px;
    color: #f06292;
    margin-top: 12px;
    letter-spacing: 1px;
  }

  /* ===== GỢI Ý BẤM ===== */
  .hint {
    position: absolute;
    bottom: -55px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #ad1457;
    font-style: italic;
    animation: bounceHint 1.5s ease-in-out infinite;
    white-space: nowrap;
    transition: opacity 0.4s;
  }
  @keyframes bounceHint {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.7; }
    50% { transform: translateX(-50%) translateY(-5px); opacity: 1; }
  }

  /* ===== NÚT NEXT GÓC PHẢI DƯỚI ===== */
  .btn-next-float {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ec407a, #d81b60);
    color: #fff;
    border: none;
    font-size: 30px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(216, 27, 96, 0.5);
    transition: all 0.3s ease;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulseBtn 2s ease-in-out infinite;
    line-height: 1;
    padding-bottom: 4px;
  }
  .btn-next-float:hover {
    transform: scale(1.15) rotate(10deg);
    box-shadow: 0 12px 40px rgba(216, 27, 96, 0.7);
  }
  @keyframes pulseBtn {
    0%, 100% { box-shadow: 0 8px 25px rgba(216, 27, 96, 0.5); }
    50% { box-shadow: 0 8px 40px rgba(216, 27, 96, 0.9); }
  }

  /* ===== NÚT ĐÓNG GÓC TRÁI DƯỚI ===== */
  .btn-close-float {
    position: fixed;
    bottom: 30px;
    left: 30px;
    padding: 14px 22px;
    border-radius: 50px;
    background: rgba(255,255,255,0.9);
    color: #d81b60;
    border: 2px solid #d81b60;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(216, 27, 96, 0.25);
    transition: all 0.3s;
    z-index: 1000;
    display: none;
    font-family: inherit;
  }
  .btn-close-float:hover {
    background: #d81b60;
    color: #fff;
  }
  .btn-close-float.show { display: block; }

  @media (max-width: 600px) {
    .arc-text { font-size: 14px; letter-spacing: 1px; top: 4%; }
    .envelope-wrapper { width: 260px; height: 180px; }
    .envelope-flap {
      border-left-width: 130px;
      border-right-width: 130px;
      border-top-width: 90px;
    }
    .card-inside {
      width: 290px;
      height: 280px;
      padding: 16px 18px;
    }
    .envelope.open .card-inside {
      transform: translateX(-50%) translateY(-155px) scale(1.02);
    }
    .card-title { font-size: 15px; }
    .card-text { font-size: 12.5px; }
    .btn-next-float { width: 55px; height: 55px; font-size: 26px; bottom: 20px; right: 20px; }
    .btn-close-float { padding: 10px 16px; font-size: 12px; bottom: 20px; left: 20px; }
  }
</style>
</head>
<body>

  <div id="heartOutline"></div>
  <div class="arc-text">From With Love 20/10! 🌹 Happy Women's Day</div>

  <div class="envelope-wrapper" id="envelopeWrapper" onclick="openEnvelope()">
    <div class="envelope" id="envelope">
      <div class="envelope-back"></div>
      <div class="card-inside" id="cardInside">
        <div class="card-title" id="cardTitle">💌 Gửi các cô và các bạn nữ 12A6 💌</div>
        <div class="card-text" id="cardText"></div>
        <div class="card-page" id="cardPage"></div>
      </div>
      <div class="envelope-flap"></div>
      <div class="envelope-front"></div>
    </div>
    <div class="hint" id="hint">👆 Bấm vào phong bì để mở</div>
  </div>

  <button class="btn-next-float" id="btnNext" onclick="nextMessage()">›</button>
  <button class="btn-close-float" id="btnClose" onclick="closeEnvelope()">← Đóng lại</button>

<script>
  /* ===== VÒNG TRÁI TIM ===== */
  const heartOutline = document.getElementById('heartOutline');
  const dotCount = 80;

  function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    return { x: x, y: -y };
  }

  function buildHeartDots() {
    heartOutline.innerHTML = '';
    const w = window.innerWidth;
    const h = window.innerHeight;
    const scale = Math.min(w, h) / 50;

    for (let i = 0; i < dotCount; i++) {
      const t = (i / dotCount) * Math.PI * 2;
      const p = heartPoint(t);
      const dot = document.createElement('div');
      dot.className = 'heart-dot';
      dot.style.left = `calc(50% + ${p.x * scale}px - 4px)`;
      dot.style.top = `calc(50% + ${p.y * scale}px - 4px)`;
      dot.style.animationDelay = (i * 0.025) + 's';
      heartOutline.appendChild(dot);
    }
  }

  buildHeartDots();
  window.addEventListener('resize', buildHeartDots);

  /* ===== NỘI DUNG 6 SLIDE ===== */
  const messages = [
    {
      title: "🌷 Lời Chúc Mừng 20/10 🌷",
      text: "Nhân dịp <strong>Ngày Phụ nữ Việt Nam 20/10</strong>, tập thể lớp <strong>12A6</strong> xin gửi đến các cô giáo và toàn thể các bạn nữ những lời chúc tốt đẹp, chân thành và ý nghĩa nhất! 🌸💐"
    },
    {
      title: "💐 Kính Chúc Các Cô Giáo 💐",
      text: "Chúng em xin kính chúc các cô giáo luôn <strong>mạnh khỏe, hạnh phúc, xinh đẹp</strong> và tràn đầy nhiệt huyết với sự nghiệp trồng người cao quý.<br><br>Cảm ơn các cô đã luôn tận tình dạy dỗ, quan tâm và dìu dắt chúng em trên con đường học tập, giúp chúng em trưởng thành hơn từng ngày và có thêm động lực để chinh phục những ước mơ của mình. ❤️"
    },
    {
      title: "🌷 Gửi Các Bạn Nữ 12A6 🌷",
      text: "Gửi đến những bông hoa xinh đẹp của đại gia đình 12A6, chúc các bạn nữ luôn <strong>vui vẻ, tự tin, xinh xắn, học giỏi</strong> và ngày càng tỏa sáng theo cách riêng của mình.<br><br>Mong rằng các bạn sẽ luôn giữ được nụ cười rạng rỡ, có thật nhiều niềm vui, gặp nhiều may mắn và đạt được những mục tiêu mà bản thân đã đặt ra. Chúc các bạn không chỉ xinh đẹp bên ngoài mà còn luôn <strong>mạnh mẽ, bản lĩnh, yêu thương bản thân</strong> và không ngừng hoàn thiện chính mình. 🌷✨"
    },
    {
      title: "✨ Thanh Xuân Lớp 12 ✨",
      text: "Thanh xuân lớp 12 là một chặng đường thật đặc biệt, với những kỷ niệm, tiếng cười và cả những khoảnh khắc đáng nhớ bên thầy cô, bạn bè.<br><br>Hy vọng rằng mỗi thành viên của <strong>12A6</strong> sẽ luôn trân trọng khoảng thời gian này, cùng nhau tạo nên thật nhiều kỷ niệm đẹp và để những năm tháng học trò trở thành một phần thanh xuân không thể nào quên."
    },
    {
      title: "🌹 Lời Chúc Cuối 🌹",
      text: "Tập thể lớp 12A6 xin chúc các cô giáo và tất cả các bạn nữ có một ngày 20/10 thật <strong>vui vẻ, hạnh phúc</strong>, ngập tràn hoa, quà và những lời yêu thương.<br><br>Chúc mọi người luôn được trân trọng, yêu thương và gặp thật nhiều điều tốt đẹp trong cuộc sống. Mong rằng không chỉ riêng ngày 20/10 mà cả <strong>365 ngày trong năm</strong>, các cô và các bạn nữ đều luôn rạng rỡ như những đóa hoa, sống hết mình với đam mê và luôn hạnh phúc với những gì mình lựa chọn! 💕🌺"
    },
    {
      title: "🎉 HAPPY 20/10! 🎉",
      text: "<strong>HAPPY VIETNAMESE WOMEN'S DAY 20/10!</strong> 🎉💗<br><br>🌸 <em>Tập thể lớp 12A6 – Gửi ngàn lời yêu thương đến một nửa xinh đẹp của thế giới!</em> 🌸"
    }
  ];

  let currentMsg = 0;
  const envelope = document.getElementById('envelope');
  const hint = document.getElementById('hint');
  const btnClose = document.getElementById('btnClose');
  const cardTitle = document.getElementById('cardTitle');
  const cardText = document.getElementById('cardText');
  const cardPage = document.getElementById('cardPage');
  const cardInside = document.getElementById('cardInside');

  let typeTimer = null;
  let isOpen = false;

  /* ===== MỞ PHONG BÌ ===== */
  function openEnvelope() {
    if (isOpen) return;
    isOpen = true;
    envelope.classList.add('open');
    hint.style.opacity = '0';
    btnClose.classList.add('show');
    cardTitle.textContent = messages[0].title;
    setTimeout(() => {
      typeText(messages[0].text);
      updatePage();
    }, 850);
  }

  /* ===== ĐÓNG PHONG BÌ ===== */
  function closeEnvelope() {
    isOpen = false;
    envelope.classList.remove('open');
    btnClose.classList.remove('show');
    clearInterval(typeTimer);
    cardText.innerHTML = '';
    cardPage.textContent = '';
    setTimeout(() => { hint.style.opacity = '1'; }, 600);
  }

  /* ===== GÕ CHỮ TỪNG KÝ TỰ (giữ nguyên thẻ HTML) ===== */
  function typeText(html) {
    clearInterval(typeTimer);

    // Tách HTML thành các token: thẻ <...> và text
    const tokens = [];
    const regex = /(<[^>]+>)|([^<]+)/g;
    let m;
    while ((m = regex.exec(html)) !== null) {
      if (m[1]) tokens.push({ type: 'tag', content: m[1] });
      else tokens.push({ type: 'text', content: m[2] });
    }

    // Xây dựng buffer dần dần
    let buffer = '';
    let tokenIndex = 0;
    let charIndex = 0;
    const cursor = '<span class="cursor"></span>';

    cardText.innerHTML = cursor;

    typeTimer = setInterval(() => {
      if (tokenIndex >= tokens.length) {
        clearInterval(typeTimer);
        return;
      }

      const token = tokens[tokenIndex];

      if (token.type === 'tag') {
        // Thẻ HTML: thêm nguyên cả thẻ vào buffer (không đếm ký tự)
        buffer += token.content;
        tokenIndex++;
        cardText.innerHTML = buffer + cursor;
      } else {
        // Text: thêm từng ký tự
        if (charIndex < token.content.length) {
          buffer += token.content[charIndex];
          charIndex++;
          cardText.innerHTML = buffer + cursor;

          // Bùng nổ hoa mỗi 5 ký tự
          if (charIndex % 5 === 0) createFalling();
        } else {
          // Hết đoạn text này → sang token tiếp
          tokenIndex++;
          charIndex = 0;
        }
      }
    }, 28);
  }

  function updatePage() {
    cardPage.textContent = (currentMsg + 1) + ' / ' + messages.length;
  }

  /* ===== NÚT NEXT ===== */
  function nextMessage() {
    currentMsg = (currentMsg + 1) % messages.length;
    cardTitle.textContent = messages[currentMsg].title;

    if (isOpen) {
      cardText.style.opacity = '0';
      setTimeout(() => {
        typeText(messages[currentMsg].text);
        cardText.style.opacity = '1';
        updatePage();
        cardInside.scrollTop = 0;
      }, 200);
    } else {
      openEnvelope();
    }

    for (let i = 0; i < 8; i++) {
      setTimeout(createFalling, i * 60);
    }
  }

  /* ===== HOA RƠI ===== */
  const emojis = ['❤️', '🌸', '💖', '🌹', '💕', '🌺', '💗', '🌸', '💝', '🌷', '✨', '💐'];

  function createFalling() {
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (Math.random() * 18 + 16) + 'px';
    const duration = Math.random() * 3 + 4;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (duration + 2) * 1000);
  }

  setInterval(createFalling, 500);
</script>
</body>
</html>
